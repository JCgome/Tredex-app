<section class="group-cards">
  <div *ngFor="let product of data" class="card" style="width: 20rem">
    <img [src]="product.image" class="card-img-top" [alt]="product.title" />
    <div class="card-body">
      <h5 class="card-title">{{ product.category }}</h5>
      <p class="card-text">{{ product.rating.rate }}</p>
      <a [href]="product" class="btn btn-primary">Go somewhere</a>
    </div>
  </div>
</section>
